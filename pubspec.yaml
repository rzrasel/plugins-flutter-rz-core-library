name: rz_core_library
description: A powerful Flutter utility library for clean architecture - validators, extensions, mappers, JSON helpers, session handling and common reusable widgets.
version: 1.0.0
repository: https://github.com/rzrasel/plugins-flutter-rz-core-library
homepage: https://github.com/rzrasel/plugins-flutter-rz-core-library

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  #
  intl: ^0.20.3
  dns_client: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  plugin:
    platforms:
      android:
        package: com.rzrasel.rz_core_library
        pluginClass: RzCoreLibraryPlugin
      ios:
        pluginClass: RzCoreLibraryPlugin
      linux:
        pluginClass: RzCoreLibraryPlugin
      macos:
        pluginClass: RzCoreLibraryPlugin
      windows:
        pluginClass: RzCoreLibraryPluginCApi
      web:
        pluginClass: RzCoreLibraryWeb
        fileName: rz_core_library_web.dart

